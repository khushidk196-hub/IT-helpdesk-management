name: CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:

  # Frontend
  build_client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Build client
        working-directory: ./client
        run: npm run build

      - name: Run client tests
        working-directory: ./client
        run: npm test


  # Backend
  test_server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Run server tests
        working-directory: ./server
        run: npm test


  # Deploy
  deploy:
    runs-on: ubuntu-latest

    needs:
      - build_client
      - test_server

    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: echo "Run Deploy App"
